<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Neon Bull Candle Gradient -->
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Neon Bear Candle Gradient -->
    <linearGradient id="bearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Accent Aura Ring -->
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#818CF8" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#auraGrad)" stroke-width="6" filter="url(#shadowFilter)"/>

  <!-- Subtle Chart Grid Lines -->
  <path d="M 64 160 L 448 160 M 64 256 L 448 256 M 64 352 L 448 352" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>
  <path d="M 160 64 L 160 448 M 256 64 L 256 448 M 352 64 L 352 448" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Glowing Aura Circle in Center -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#auraGrad)" stroke-width="3" opacity="0.3" filter="url(#neonGlow)"/>

  <!-- Candlestick 1: Bullish Left -->
  <line x1="140" y1="180" x2="140" y2="340" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <rect x="122" y="210" width="36" height="90" rx="6" fill="url(#bullGrad)" stroke="#38BDF8" stroke-width="2" filter="url(#neonGlow)"/>

  <!-- Candlestick 2: Bearish Center-Left -->
  <line x1="220" y1="150" x2="220" y2="370" stroke="#F43F5E" stroke-width="4" stroke-linecap="round"/>
  <rect x="202" y="190" width="36" height="130" rx="6" fill="url(#bearGrad)" stroke="#FB7185" stroke-width="2" filter="url(#neonGlow)"/>

  <!-- Candlestick 3: Bullish Center-Right (Hero) -->
  <line x1="300" y1="110" x2="300" y2="350" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <rect x="282" y="140" width="36" height="150" rx="6" fill="url(#bullGrad)" stroke="#38BDF8" stroke-width="2" filter="url(#neonGlow)"/>

  <!-- Candlestick 4: Bullish Right -->
  <line x1="380" y1="90" x2="380" y2="290" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <rect x="362" y="120" width="36" height="110" rx="6" fill="url(#bullGrad)" stroke="#38BDF8" stroke-width="2" filter="url(#neonGlow)"/>

  <!-- Dynamic Trend Curve -->
  <path d="M 100 360 Q 200 310 270 200 T 420 100" fill="none" stroke="#FCD34D" stroke-width="4" stroke-linecap="round" stroke-dasharray="10,6" filter="url(#neonGlow)"/>

  <!-- Brand Symbol / Badge Text -->
  <rect x="176" y="396" width="160" height="36" rx="18" fill="#1E293B" stroke="url(#auraGrad)" stroke-width="2" />
  <text x="256" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">AURACHART</text>
</svg>
